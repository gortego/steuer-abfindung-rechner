[notes]
year_hint = 2027 ist noch nicht verabschiedet – siehe Hinweise.
draft_warning = 2027 basiert auf dem noch nicht verabschiedeten Regierungsentwurf vom 02.09.2026 (Stand 06.11.2026). Alle Angaben ohne Gewähr; keine Steuerberatung. Für eine verbindliche Berechnung bitte Steuerberatung hinzuziehen.
negative_charts_note = Die Gehaltsachsen der Diagramme beginnen bei -100.000 € und erweitern sich bei stärker negativen Gehältern, damit negative Einkünfte und negative Netto-Werte im Abfindungsjahr sichtbar bleiben. Negative Gehälter können im Zahlenfeld eingegeben werden; die Regler bleiben bei 0–150.000 €. Auch die Netto-Skalen und die Y-Achsen zeigen negative Beträge ohne Kappung.
charts_note_single = Die Heatmap zeigt das beste Netto/Jahr in Abhängigkeit vom Gehalt von Partner #1. Für jedes Gehalt werden die beiden Fälle der Einzelveranlagung mit und ohne Fünftelregelung geprüft. Farbe kodiert das beste Netto in EUR; die Skala heißt „Bestes Netto/Jahr“. Die Nettoquote ist das beste Netto inklusive Kindergeld geteilt durch das Bruttogehalt von Partner #1 und dessen Abfindung; ohne Abzüge wäre sie 100 %. Zusätzlich zeigt die „Quote vs. ohne Gehalt“ das Netto im Verhältnis zum besten Netto bei Gehalt 0 von Partner #1. Eine 100-%-Grenze gibt es für den EUR-Wert nicht. Violett gestrichelt = Break-even, rot gepunktet = Worst case (nur bei positiven Gehältern). Eine grau gestrichelte Linie markiert das Gehalt 0. Der Gehaltsregler bleibt bei 0–150.000 € und der Abfindungsregler bei 0–500.000 €; größere Beträge können in den Zahlenfeldern eingegeben werden. Die Achsen zoomen automatisch mit: Sie beginnen bei -100.000 € bis 150.000 €, erweitern sich in groben Schritten bis maximal 10 Mio. €, sobald ein Gehalt über 90 % der aktuellen Skala liegt, und zoomen zurück, wenn es unter 50 % fällt; am aktuellen Punkt stehen Netto, Nettoquote und der Vergleich mit Gehalt 0. Die Zahlenfelder für Gehalt und Abfindung verwenden 1.000er-Schritte. In diesem Modus wird nur Partner #1 dargestellt; die 3D-Fläche ist ausgeblendet.
charts_note = Die Heatmap zeigt das beste Netto/Jahr in Abhängigkeit von beiden Gehältern: Für jedes Gehalts-Paar werden alle vier Fälle geprüft – Einzel- oder Zusammenveranlagung jeweils mit und ohne Fünftelregelung. Farbe und 3D-Höhe kodieren das beste Haushaltsnetto in EUR; die Skala heißt „Bestes Netto/Jahr“. Die Nettoquote ist das beste Netto inklusive Kindergeld geteilt durch die Summe aus beiden Bruttogehältern und beiden Abfindungen; ohne Abzüge wäre sie 100 %. Zusätzlich zeigt die „Quote vs. ohne Gehalt“ das Netto im Verhältnis zum besten Netto bei Gehalt 0 von Partner #1 und folgt der U-Form des Haushaltsnettos. Eine 100-%-Grenze gibt es für den EUR-Wert nicht. Schraffiert = Einzelveranlagung, glatt = Zusammenveranlagung, die feine hellrote gestrichelte Linie markiert die Grenze; violett gestrichelt = Break-even, rot gepunktet = Worst case (nur bei positiven Gehältern beider Partner). Eine grau gestrichelte Linie markiert in allen Gehaltsdiagrammen das Gehalt 0; bei der 3D-Fläche ist die Tiefe das Bruttojahresgehalt von Partner #2. Die Gehaltsregler bleiben bei 0–150.000 € und die Abfindungsregler bei 0–500.000 €; größere Beträge können in den Zahlenfeldern eingegeben werden. Beide Diagrammachsen zoomen automatisch mit: Sie beginnen bei -100.000 € bis 150.000 €, erweitern sich in groben Schritten bis maximal 10 Mio. €, sobald ein Gehalt über 90 % der aktuellen Skala liegt, und zoomen zurück, wenn beide Gehälter unter 50 % fallen; am aktuellen Punkt stehen Haushaltsnetto, Nettoquote und der Vergleich mit Gehalt 0. Die Zahlenfelder für Gehalt und Abfindung verwenden 1.000er-Schritte. Das höchste Netto je Brutto-plus-Abfindung und die zugehörige Nettoquote stehen unter allen Gehaltsreglern. Die 3D-Fläche zeigt dieselben Zellen als Höhe und Farbe; eine violette Linie mit „P2 …“ folgt dem eingestellten Gehalt von Partner #2 über alle Gehälter von Partner #1; violett mit „Break-even“ und rot gepunktet mit „Worst case“ sind die entsprechenden Linien über alle Gehälter von Partner #2; grün markiert die günstigste Gehaltskombination, weiß die aktuellen Eingaben. Die Kurve „Absolutes Netto“ variiert das Gehalt von Partner #1 bei eingestelltem Gehalt von Partner #2; ihre Y-Achse zeigt das beste Netto/Jahr in EUR. Im Diagramm „Lohnt sich Arbeiten im Abfindungsjahr?“ bleibt das Gehalt von Partner #2 für die Kurven konstant; eine horizontale rote Linie markiert das Netto-Niveau des Worst case. Break-even, Worst case und Differenz stehen auf eigenen Zeilen; als wichtigste Aussage ist der Vergleich des aktuellen Netto mit „ohne Gehalt“ farbig hervorgehoben (rot bei weniger Netto, grün bei mehr Netto). Die Beschriftung am wandernden Punkt ist rot, wenn „weniger als ohne Gehalt“ angezeigt wird, sonst grün. Im Grenzsteuersatz-Diagramm markieren gestrichelte Linien den Beginn nach dem Grundfreibetrag, die Zonenwechsel bei etwa 24 % und 42 % sowie den Eintritt in den Spitzensteuersatz; die X-Achse reicht bis 600.000 € zvE; der Grenzsteuersatz steht mit „G“ und „S“ auf der Y-Achse und der zvE kurz in drei versetzten Zeilen unter der X-Achse. Die dunklen gestrichelten Linien und Punkte mit „Aktuell ...“ bezeichnen die aktuellen Werte beider Tarife; ihre zvE-Werte sind unter der Achse fett. Die Abfindung wird als echte Entschädigung ohne Sozialabgaben behandelt; Lohn-, Urlaubs- oder Freistellungszahlungen wären anders zu bewerten.
